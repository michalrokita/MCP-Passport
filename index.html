document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ight, rgba(255,255,255,0.018) 1px, transparent 1px),\n      linear-gradient(to bottom, rgba(255,255,255,0.018) 1px, transparent 1px);\n    background-size: 64px 64px;\n    z-index: 0;\n  }\n  body::after {\n    content: \"\";\n    position: fixed;\n    inset: 0;\n    pointer-events: none;\n    background: radial-gradient(ellipse 80% 60% at 50% -10%, var(--accent-glow), transparent 60%);\n    z-index: 0;\n  }\n\n  main { position: relative; z-index: 1; }\n\n  /* ---------- Top bar ---------- */\n  .topbar {\n    position: fixed;\n    top: 0; left: 0; right: 0;\n    z-index: 50;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    padding: 16px 32px;\n    backdrop-filter: blur(12px);\n    -webkit-backdrop-filter: blur(12px);\n    background: rgba(10,10,10,0.55);\n    border-bottom: 1px solid transparent;\n    transition: border-color 0.3s ease;\n  }\n  .topbar.scrolled { border-bottom-color: var(--line); }\n  .brand {\n    display: flex; align-items: center; gap: 10px;\n    font-weight: 600;\n    letter-spacing: -0.01em;\n  }\n  .brand-mark {\n    width: 22px; height: 22px;\n    border: 1px solid var(--accent);\n    border-radius: 4px;\n    display: grid; place-items: center;\n    color: var(--accent);\n    font-size: 11px;\n    font-weight: 700;\n    background: var(--accent-glow);\n  }\n  .brand-mark::after {\n    content: \"\";\n    width: 8px; height: 8px;\n    background: var(--accent);\n    border-radius: 1px;\n    box-shadow: 0 0 8px var(--accent);\n  }\n  .brand-mark::before { content: none; }\n  .brand-name { font-family: var(--mono); font-size: 14px; }\n  .brand-name b { font-weight: 600; color: var(--ink); }\n  .brand-name span { color: var(--dim); font-weight: 400; }\n  .topnav {\n    display: flex; align-items: center; gap: 28px;\n    font-size: 13px;\n  }\n  .topnav a {\n    color: var(--ink-2);\n    text-decoration: none;\n    transition: color 0.15s;\n  }\n  .topnav a:hover { color: var(--accent); }\n  .top-cta {\n    padding: 7px 14px;\n    border: 1px solid var(--accent);\n    color: var(--accent);\n    background: var(--accent-glow);\n    border-radius: 6px;\n    font-size: 12px;\n    text-decoration: none;\n    transition: all 0.15s;\n    cursor: pointer;\n  }\n  .top-cta:hover { background: var(--accent); color: #0a0a0a; }\n  .top-cta .dot {\n    display: inline-block; width: 6px; height: 6px;\n    background: currentColor;\n    border-radius: 50%;\n    margin-right: 6px;\n    animation: blink 1.6s infinite;\n    vertical-align: middle;\n  }\n  @keyframes blink {\n    0%, 60%, 100% { opacity: 1; }\n    30% { opacity: 0.2; }\n  }\n\n  /* ---------- Layout ---------- */\n  .container {\n    max-width: 1200px;\n    margin: 0 auto;\n    padding: 0 32px;\n  }\n  .section {\n    position: relative;\n    padding: 140px 0;\n  }\n  .section-label {\n    display: inline-flex;\n    align-items: center;\n    gap: 10px;\n    font-size: 11px;\n    color: var(--dim);\n    text-transform: uppercase;\n    letter-spacing: 0.18em;\n    margin-bottom: 28px;\n  }\n  .section-label::before {\n    content: \"\";\n    width: 24px; height: 1px;\n    background: var(--dim-2);\n  }\n  .section-label .num { color: var(--accent); }\n\n  /* ---------- Hero ---------- */\n  .hero {\n    min-height: 100vh;\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    padding: 120px 0 80px;\n    position: relative;\n  }\n  .hero-tag {\n    display: inline-flex; align-items: center; gap: 10px;\n    font-size: 12px;\n    color: var(--ink-2);\n    padding: 6px 12px;\n    border: 1px solid var(--line-2);\n    border-radius: 999px;\n    background: rgba(255,255,255,0.02);\n    margin-bottom: 32px;\n    width: fit-content;\n  }\n  .hero-tag .pulse {\n    width: 6px; height: 6px;\n    border-radius: 50%;\n    background: var(--accent);\n    box-shadow: 0 0 8px var(--accent);\n    animation: pulse 2s infinite;\n  }\n  @keyframes pulse {\n    0%, 100% { opacity: 1; transform: scale(1); }\n    50% { opacity: 0.5; transform: scale(0.85); }\n  }\n  .hero h1 {\n    font-family: var(--mono);\n    font-weight: 500;\n    font-size: clamp(40px, 6.4vw, 88px);\n    line-height: 1.02;\n    letter-spacing: -0.035em;\n    margin: 0 0 28px;\n    max-width: 14ch;\n    text-wrap: balance;\n  }\n  .hero h1 .accent { color: var(--accent); }\n  .hero h1 .strike { color: var(--dim); text-decoration: line-through; text-decoration-thickness: 2px; }\n  .hero-sub {\n    max-width: 56ch;\n    font-size: 17px;\n    color: var(--ink-2);\n    line-height: 1.55;\n    margin: 0 0 48px;\n    text-wrap: pretty;\n  }\n  .hero-actions {\n    display: flex;\n    gap: 14px;\n    align-items: center;\n    flex-wrap: wrap;\n  }\n  .btn {\n    display: inline-flex;\n    align-items: center;\n    gap: 10px;\n    padding: 14px 22px;\n    border-radius: 8px;\n    font-family: var(--mono);\n    font-size: 14px;\n    font-weight: 500;\n    text-decoration: none;\n    cursor: pointer;\n    border: 1px solid transparent;\n    transition: all 0.18s;\n  }\n  .btn-primary {\n    background: var(--accent);\n    color: #0a0a0a;\n    border-color: var(--accent);\n    box-shadow: 0 0 0 1px var(--accent), 0 0 30px var(--accent-glow);\n  }\n  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 0 0 1px var(--accent), 0 0 40px var(--accent); }\n  .btn-primary[disabled], .btn-primary.coming {\n    background: transparent;\n    color: var(--accent);\n    box-shadow: none;\n    cursor: default;\n  }\n  .btn-primary.coming:hover { transform: none; }\n  .btn-secondary {\n    background: rgba(255,255,255,0.03);\n    color: var(--ink);\n    border-color: var(--line-2);\n  }\n  .btn-secondary:hover { border-color: var(--ink-2); background: rgba(255,255,255,0.05); }\n  .btn .icon { width: 14px; height: 14px; }\n  .btn .arrow { transition: transform 0.2s; }\n  .btn:hover .arrow { transform: translateX(3px); }\n  .meta-row {\n    display: flex; gap: 28px;\n    margin-top: 32px;\n    font-size: 12px;\n    color: var(--dim);\n    flex-wrap: wrap;\n  }\n  .meta-row span::before {\n    content: \"—\";\n    color: var(--dim-2);\n    margin-right: 8px;\n  }\n\n  /* Hero ascii vignette */\n  .hero-ascii {\n    position: absolute;\n    right: -60px;\n    top: 50%;\n    transform: translateY(-50%);\n    font-size: 11px;\n    line-height: 1.1;\n    color: var(--dim-2);\n    white-space: pre;\n    pointer-events: none;\n    opacity: 0.6;\n    user-select: none;\n  }\n  @media (max-width: 1100px) { .hero-ascii { display: none; } }\n\n  /* ---------- The Mess ---------- */\n  .mess {\n    background: linear-gradient(180deg, transparent, rgba(255,255,255,0.012), transparent);\n    overflow: hidden;\n  }\n  .mess h2 {\n    font-family: var(--mono);\n    font-weight: 500;\n    font-size: clamp(34px, 4.8vw, 60px);\n    line-height: 1.05;\n    letter-spacing: -0.03em;\n    margin: 0 0 20px;\n    max-width: 22ch;\n  }\n  .mess h2 .warn { color: var(--warn); }\n  .mess-sub {\n    font-size: 16px;\n    color: var(--ink-2);\n    max-width: 52ch;\n    margin: 0 0 64px;\n  }\n  .mess-stage {\n    position: relative;\n    height: 540px;\n    border: 1px solid var(--line);\n    border-radius: 12px;\n    background: var(--bg-2);\n    overflow: hidden;\n  }\n  .mess-stage::before {\n    content: \"\";\n    position: absolute;\n    inset: 0;\n    background:\n      radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(10,10,10,0.85) 75%);\n    pointer-events: none;\n    z-index: 5;\n  }\n  .mess-card {\n    position: absolute;\n    width: 280px;\n    background: var(--bg-3);\n    border: 1px solid var(--line-2);\n    border-radius: 8px;\n    padding: 12px 14px;\n    font-family: var(--mono);\n    font-size: 11.5px;\n    line-height: 1.5;\n    box-shadow: 0 12px 40px rgba(0,0,0,0.6);\n  }\n  .mess-card .head {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    margin-bottom: 8px;\n    padding-bottom: 8px;\n    border-bottom: 1px solid var(--line);\n  }\n  .mess-card .filename { color: var(--ink-2); font-size: 11px; }\n  .mess-card .badge {\n    font-size: 9px;\n    padding: 2px 6px;\n    border-radius: 3px;\n    background: rgba(255,255,255,0.04);\n    color: var(--dim);\n    text-transform: uppercase;\n    letter-spacing: 0.08em;\n  }\n  .mess-card .badge.broken { background: oklch(0.7 0.18 25 / 0.15); color: var(--danger); }\n  .mess-card .badge.stale { background: oklch(0.78 0.14 75 / 0.15); color: var(--warn); }\n  .mess-card pre {\n    margin: 0;\n    white-space: pre-wrap;\n    color: var(--dim);\n    font-size: 11px;\n  }\n  .mess-card .k { color: var(--ink-2); }\n  .mess-card .s { color: var(--accent); }\n  .mess-card .n { color: var(--warn); }\n  .mess-card .c { color: var(--dim-2); }\n\n  .mess-quote {\n    position: absolute;\n    z-index: 6;\n    text-align: center;\n    left: 50%;\n    top: 50%;\n    transform: translate(-50%, -50%);\n    pointer-events: none;\n  }\n  .mess-quote p {\n    font-family: var(--mono);\n    font-size: 13px;\n    color: var(--dim);\n    margin: 0;\n  }\n  .mess-quote h3 {\n    font-family: var(--mono);\n    font-weight: 400;\n    font-size: clamp(22px, 2.6vw, 32px);\n    color: var(--ink);\n    margin: 8px 0 0;\n    letter-spacing: -0.02em;\n  }\n  .mess-quote h3 .strike { color: var(--dim); text-decoration: line-through; }\n\n  .mess-symptoms {\n    margin-top: 64px;\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 1px;\n    background: var(--line);\n    border: 1px solid var(--line);\n    border-radius: 12px;\n    overflow: hidden;\n  }\n  .symptom {\n    background: var(--bg-2);\n    padding: 28px;\n  }\n  .symptom .num {\n    font-size: 11px;\n    color: var(--dim);\n    margin-bottom: 16px;\n    letter-spacing: 0.1em;\n  }\n  .symptom h4 {\n    font-family: var(--mono);\n    font-weight: 500;\n    font-size: 16px;\n    margin: 0 0 8px;\n    color: var(--ink);\n    letter-spacing: -0.01em;\n  }\n  .symptom p {\n    font-size: 13px;\n    color: var(--ink-2);\n    margin: 0;\n    line-height: 1.6;\n  }\n  @media (max-width: 800px) {\n    .mess-symptoms { grid-template-columns: 1fr; }\n  }\n\n  /* ---------- Meet Passport ---------- */\n  .meet h2 {\n    font-family: var(--mono);\n    font-weight: 500;\n    font-size: clamp(34px, 4.8vw, 60px);\n    line-height: 1.05;\n    letter-spacing: -0.03em;\n    margin: 0 0 20px;\n    max-width: 18ch;\n  }\n  .meet h2 .accent { color: var(--accent); }\n  .meet-sub {\n    font-size: 16px;\n    color: var(--ink-2);\n    max-width: 56ch;\n    margin: 0 0 64px;\n  }\n  .meet-grid {\n    display: grid;\n    grid-template-columns: 1.1fr 1fr;\n    gap: 48px;\n    align-items: stretch;\n  }\n  @media (max-width: 900px) { .meet-grid { grid-template-columns: 1fr; } }\n\n  .passport-card {\n    background: var(--bg-2);\n    border: 1px solid var(--line-2);\n    border-radius: 12px;\n    overflow: hidden;\n    position: relative;\n  }\n  .passport-chrome {\n    display: flex;\n    align-items: center;\n    gap: 12px;\n    padding: 12px 16px;\n    background: var(--bg-3);\n    border-bottom: 1px solid var(--line);\n  }\n  .passport-chrome .dots { display: flex; gap: 6px; }\n  .passport-chrome .dots i {\n    width: 10px; height: 10px; border-radius: 50%;\n    background: var(--line-2);\n    display: inline-block;\n  }\n  .passport-chrome .title {\n    font-size: 11px;\n    color: var(--dim);\n    margin-left: auto;\n  }\n  .passport-body {\n    padding: 22px 24px;\n  }\n  .passport-section-title {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    font-size: 11px;\n    color: var(--dim);\n    text-transform: uppercase;\n    letter-spacing: 0.12em;\n    margin-bottom: 14px;\n  }\n  .passport-section-title .count { color: var(--accent); }\n  .passport-list {\n    display: grid;\n    gap: 6px;\n    margin-bottom: 22px;\n  }\n  .passport-item {\n    display: grid;\n    grid-template-columns: 18px 1fr auto auto;\n    align-items: center;\n    gap: 12px;\n    padding: 10px 12px;\n    background: var(--bg-3);\n    border: 1px solid var(--line);\n    border-radius: 6px;\n    font-size: 12.5px;\n    transition: border-color 0.15s;\n  }\n  .passport-item:hover { border-color: var(--line-2); }\n  .passport-item .ico {\n    width: 18px; height: 18px;\n    border-radius: 4px;\n    display: grid;\n    place-items: center;\n    font-size: 9px;\n    color: var(--dim);\n    background: var(--bg-2);\n    border: 1px solid var(--line-2);\n  }\n  .passport-item .name { color: var(--ink); }\n  .passport-item .ver { color: var(--dim); font-size: 11px; }\n  .passport-item .status {\n    font-size: 10px;\n    color: var(--accent);\n    display: inline-flex;\n    align-items: center;\n    gap: 6px;\n  }\n  .passport-item .status::before {\n    content: \"\";\n    width: 6px; height: 6px;\n    background: var(--accent);\n    border-radius: 50%;\n    box-shadow: 0 0 6px var(--accent);\n  }\n\n  .meet-side {\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    gap: 24px;\n  }\n  .feat {\n    border-left: 1px solid var(--line-2);\n    padding: 4px 0 4px 18px;\n    transition: border-color 0.18s;\n  }\n  .feat:hover { border-left-color: var(--accent); }\n  .feat .label {\n    font-size: 11px;\n    color: var(--accent);\n    letter-spacing: 0.1em;\n    text-transform: uppercase;\n    margin-bottom: 6px;\n  }\n  .feat h4 {\n    font-family: var(--mono);\n    font-weight: 500;\n    font-size: 17px;\n    margin: 0 0 6px;\n    letter-spacing: -0.01em;\n  }\n  .feat p {\n    margin: 0;\n    color: var(--ink-2);\n    font-size: 13.5px;\n    line-height: 1.55;\n  }\n\n  /* ---------- Live Sync (centerpiece) ---------- */\n  .sync {\n    padding-top: 100px;\n  }\n  .sync h2 {\n    font-family: var(--mono);\n    font-weight: 500;\n    font-size: clamp(34px, 4.8vw, 60px);\n    line-height: 1.05;\n    letter-spacing: -0.03em;\n    margin: 0 0 20px;\n    max-width: 22ch;\n  }\n  .sync h2 .accent { color: var(--accent); }\n  . 02Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <pre class=\"hero-ascii\">   ╭──────────────╮\n   │  mcp/passport │\n   ╰──────┬───────╯\n          │\n   ╭──────┼──────╮\n   ▼      ▼      ▼\n claude  codex  …<\u002Fpre>\n  <\u002Fsection>\n\n\n  <!-- ============ THE MESS ============ -->\n  <section class=\"section mess\" id=\"mess\">\n    <div class=\"container\">\n      <div class=\"section-label reveal\"><span class=\"num\">01<\u002Fspan> &nbsp;the mess<\u002Fdiv>\n      <h2 class=\"reveal delay-1\">Right now your MCPs are <span class=\"warn\">scattered like socks<\u002Fspan> across four config files.<\u002Fh2>\n      <p class=\"mess-sub reveal delay-2\">You set up an MCP in Claude. You forget you set it up. You set it up again in Codex with a slightly different name. The token expires. The path is wrong on the laptop. You ship it anyway. It's fine. <em>It is not fine.<\u002Fem><\u002Fp>\n\n      <div class=\"mess-stage reveal delay-2\" id=\"messStage\">\n        <!-- Cards float in here, populated by JS -->\n        <div class=\"mess-quote\">\n          <p>~/.config/this-is-fine<\u002Fp>\n          <h3>\"i'll fix it <span class=\"strike\">later<\u002Fspan> never\"<\u002Fh3>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"mess-symptoms\">\n        <div class=\"symptom reveal\">\n          <div class=\"num\">SYMPTOM 01<\u002Fdiv>\n          <h4>Four configs, one truth<\u002Fh4>\n          <p>Each harness wants its own JSON, its own format, its own private headcanon. You become a human merge tool.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"symptom reveal delay-1\">\n          <div class=\"num\">SYMPTOM 02<\u002Fdiv>\n          <h4>Skills go AWOL<\u002Fh4>\n          <p>That perfect skill you wrote at 1am? It exists. Somewhere. On the other machine. Behind a tunnel. You'll write it again.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"symptom reveal delay-2\">\n          <div class=\"num\">SYMPTOM 03<\u002Fdiv>\n          <h4>Tokens, paths, lies<\u002Fh4>\n          <p>Half the keys are stale, the other half are checked into a private gist titled <code>tmp-real-final2<\u002Fcode>. Auditors love this.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ============ MEET PASSPORT ============ -->\n  <section class=\"section meet\" id=\"meet\">\n    <div class=\"container\">\n      <div class=\"section-label reveal\"><span class=\"num\">02<\u002Fspan> &nbsp;meet passport<\u002Fdiv>\n      <h2 class=\"reveal delay-1\">One <span class=\"accent\">passport<\u002Fspan>. Every harness. No more drift.<\u002Fh2>\n      <p class=\"meet-sub reveal delay-2\">Passport is a tiny mac app that holds your MCPs, your skills, your secrets, and the right shape of config for every harness you use. Add once. Sync everywhere. Revoke instantly.<\u002Fp>\n\n      <div class=\"meet-grid\">\n        <div class=\"passport-card reveal delay-1\" id=\"passportCard\">\n          <div class=\"passport-chrome\">\n            <div class=\"dots\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fdiv>\n            <div class=\"title\">passport — my-laptop<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"passport-body\">\n            <div class=\"passport-section-title\">\n              <span>// installed mcps<\u002Fspan>\n              <span class=\"count\" id=\"mcpCount\">7 active<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"passport-list\" id=\"mcpList\">\n              <div class=\"passport-item\"><span class=\"ico\">▸<\u002Fspan><span class=\"name\">filesystem<\u002Fspan><span class=\"ver\">v0.4.2<\u002Fspan><span class=\"status\">synced<\u002Fspan><\u002Fdiv>\n              <div class=\"passport-item\"><span class=\"ico\">▸<\u002Fspan><span class=\"name\">github<\u002Fspan><span class=\"ver\">v1.1.0<\u002Fspan><span class=\"status\">synced<\u002Fspan><\u002Fdiv>\n              <div class=\"passport-item\"><span class=\"ico\">▸<\u002Fspan><span class=\"name\">postgre le: '~/.claude/mcps.json', badge: 'drift',\n      body: `<span class=\"c\">// \"github\" missing here<\u002Fspan>\\n<span class=\"c\">// \"linear\" exists 2x<\u002Fspan>\\n<span class=\"k\">\"linear\":<\u002Fspan> { <span class=\"k\">\"v\"<\u002Fspan>: <span class=\"s\">\"0.4\"<\u002Fspan> },\\n<span class=\"k\">\"linear\":<\u002Fspan> { <span class=\"k\">\"v\"<\u002Fspan>: <span class=\"s\">\"0.5\"<\u002Fspan> }`\n    },\n    {\n      file: 'tmp-real-final2.txt', badge: 'oh no', cls: 'broken',\n      body: `<span class=\"c\"># DO NOT COMMIT<\u002Fspan>\\n<span class=\"k\">GITHUB_TOKEN<\u002Fspan>=<span class=\"s\">ghp_REDACTED<\u002Fspan>\\n<span class=\"k\">OPENAI_KEY<\u002Fspan>=<span class=\"s\">sk-… <span class=\"c\">// rotated?<\u002Fspan><\u002Fspan>`\n    },\n    {\n      file: 'codex-cli.toml', badge: 'partial',\n      body: `<span class=\"c\"># works on prod-laptop only<\u002Fspan>\\n<span class=\"k\">[skills.pr-author]<\u002Fspan>\\n<span class=\"k\">path<\u002Fspan> = <span class=\"s\">\"~/work/skills\"<\u002Fspan>`\n    },\n    {\n      file: 'claude-desktop.json', badge: 'stale', cls: 'stale',\n      body: `<span class=\"k\">\"postgres\":<\u002Fspan> { <span class=\"k\">\"url\"<\u002Fspan>:\\n  <span class=\"s\">\"postgres://old@…\"<\u002Fspan> <span class=\"c\">// db moved<\u002Fspan>\\n}`\n    }\n  ];\n\n  const stage = document.getElementById('messStage');\n  const W = stage.clientWidth || 1100;\n  const H = 540;\n  const positions = [\n    { x: 0.04, y: 0.06, r: -7 },\n    { x: 0.62, y: 0.04, r: 5 },\n    { x: 0.82, y: 0.32, r: -3 },\n    { x: 0.04, y: 0.55, r: 4 },\n    { x: 0.30, y: 0.66, r: -6 },\n    { x: 0.66, y: 0.62, r: 8 },\n    { x: 0.42, y: 0.04, r: -2 }\n  ];\n  messCards.forEach((c, i) => {\n    const p = positions[i % positions.length];\n    const el = document.createElement('div');\n    el.className = 'mess-card';\n    el.style.left = (p.x * 100) + '%';\n    el.style.top = (p.y * 100) + '%';\n    el.style.transform = `rotate(${p.r}deg)`;\n    el.style.animation = `messFloat ${6 + (i % 4)}s ease-in-out ${i * 0.4}s infinite alternate`;\n    el.innerHTML = `\n      <div class=\"head\">\n        <span class=\"filename\">${c.file}<\u002Fspan>\n        <span class=\"badge ${c.cls || ''}\">${c.badge}<\u002Fspan>\n      <\u002Fdiv>\n      <pre>${c.body}<\u002Fpre>\n    `;\n    stage.appendChild(el);\n  });\n  // inject keyframes once\n  const sty = document.createElement('style');\n  sty.textContent = `\n    @keyframes messFloat {\n      from { transform: translate(0,0) rotate(var(--r,0deg)); }\n      to { transform: translate(6px,-8px) rotate(calc(var(--r,0deg) + 1deg)); }\n    }\n  `;\n  document.head.appendChild(sty);\n\n  // gentle parallax on mess cards\n  window.addEventListener('scroll', () => {\n    const rect = stage.getBoundingClientRect();\n    if (rect.bottom < 0 || rect.top > window.innerHeight) return;\n    const progress = (window.innerHeight - rect.top) / (window.innerHeight + rect.height);\n    const cards = stage.querySelectorAll('.mess-card');\n    cards.forEach((c, i) => {\n      const dir = i % 2 ? 1 : -1;\n      const speed = 12 + (i % 4) * 6;\n      c.style.translate = `${dir * progress * speed * 0.6}px ${(progress - 0.5) * speed}px`;\n    });\n  }, { passive: true });\n\n\n  // ============ FLOWCHART — animated chips ============\n  const flowchart = document.getElementById('flowchart');\n  const flowSvg = document.getElementById('flowSvg');\n\n  // Logical coordinates within the 1200x580 viewBox\n  const sources = [\n    { x: 14, y: 22, label: 'github' },\n    { x: 14, y: 50, label: 'code-review' },\n    { x: 14, y: 78, label: 'postgres' }\n  ];\n  const dests = [\n    { x: 86, y: 18, label: 'claude' },\n    { x: 86, y: 40, label: 'claude desktop' },\n    { x: 86, y: 62, label: 'codex' },\n    { x: 86, y: 84, label: 'codex cli' }\n  ];\n  const hub = { x: 50, y: 50 };\n\n  // pct -> svg coords (viewBox 1200x580)\n  function svgPt(p) { return { x: p.x * 12, y: p.y * 5.8 }; }\n\n  // Draw curved lines through hub\n  function drawLine(from, to, opts={}) {\n    const a = svgPt(from);\n    const b = svgPt(to);\n    const dx = b.x - a.x;\n    const c1 = { x: a.x + dx * 0.5, y: a.y };\n    const c2 = { x: b.x - dx * 0.5, y: b.y };\n    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');\n    path.setAttribute('d', `M${a.x},${a.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${b.x},${b.y}`);\n    path.setAttribute('fill', 'none');\n    path.setAttribute('stroke', opts.stroke || 'url(#lineGrad)');\n    path.setAttribute('stroke-width', opts.w || 1.2);\n    path.setAttribute('stroke-dasharray', opts.dash || '');\n    path.setAttribute('opacity', opts.op || 0.6);\n    if (opts.glow) path.setAttribute('filter', 'url(#lineGlow)');\n    flowSvg.appendChild(path);\n    return path;\n  }\n  // sources -> hub\n  sources.forEach(s => drawLine(s, hub, { dash: '4 6', op: 0.5 }));\n  // hub -> dests\n  dests.forEach(d => drawLine(hub, d, { op: 0.55, glow: true }));\n\n  // Animate chips along path: source -> hub -> dest\n  function animateChip(label, src, dst, durationEach = 1100) {\n    const chip = document.createElement('div');\n    chip.className = 'chip';\n    chip.textContent = label;\n    flowchart.appendChild(chip);\n\n    const start = src;\n    const mid = hub;\n    const end = dst;\n\n    function tween(from, to, dur) {\n      return new Promise(res => {\n        const t0 = performance.now();\n        function step(now) {\n          const k = Math.min(1, (now - t0) / dur);\n          // ease in-out cubic\n          const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;\n          const x = from.x + (to.x - from.x) * e;\n          const y = from.y + (to.y - from.y) * e;\n          chip.style.left = x + '%';\n          chip.style.top = y + '%';\n          chip.style.opacity = (k < 0.05 ? k * 20 : k > 0.95 ? (1 - k) * 20 : 1).toFixed(2);\n          if (k < 1) requestAnimationFrame(step);\n          else res();\n        }\n        requestAnimationFrame(step);\n      });\n    }\n\n    return (async () => {\n      await tween(start, mid, durationEach);\n      // brief pause at hub\n      await new Promise(r => setTimeout(r, 80));\n      await tween(mid, end, durationEach);\n      chip.remove();\n    })();\n  }\n\n  const chipLabels = [\n    { src: 0, label: 'github · v1.1.0' },\n    { src: 1, label: 'code-review · skill' },\n    { src: 2, label: 'postgres · token rotated' },\n    { src: 0, label: 'tool list updated' },\n    { src: 1, label: 'pr-author · skill' },\n    { src: 2, label: 'env synced' }\n  ];\n\n  let chipIdx = 0;\n  let flowActive = false;\n  function fireChip() {\n    if (!flowActive) return;\n    const c = chipLabels[chipIdx % chipLabels.length];\n    const src = sources[c.src];\n    // pick a random destination\n    const dst = dests[Math.floor(Math.random() * dests.length)];\n    animateChip(c.label, src, dst, 1300 + Math.random() * 400);\n    chipIdx++;\n    setTimeout(fireChip, 650 + Math.random() * 400);\n  }\n\n  // Only run when section is visible\n  const flowIo = new IntersectionObserver((entries) => {\n    entries.forEach(e => {\n      if (e.isIntersecting && !flowActive) {\n        flowActive = true;\n        fireChip();\n        // stagger a couple to start\n        setTimeout(() => { if (flowActive) fireChip(); }, 250);\n        setTimeout(() => { if (flowActive) fireChip(); }, 500);\n      } else if (!e.isIntersecting) {\n        flowActive = false;\n      }\n    });\n  }, { threshold: 0.2 });\n  flowIo.observe(flowchart);\n\n\n  // ============ Email form ============\n  const form = document.getElementById('emailForm');\n  const input = document.getElementById('emailInput');\n  const btn = document.getElementById('emailSubmit');\n  form.addEventListener('submit', () => {\n    const v = (input.value || '').trim();\n    if (!v || !/.+@.+\\..+/.test(v)) {\n      input.style.color = 'oklch(0.7 0.18 25)';\n      input.focus();\n      return;\n    }\n    input.value = `✓ on the list — ${v}`;\n    input.disabled = true;\n    btn.textContent = 'see you soon';\n    btn.disabled = true;\n    btn.style.opacity = 0.7;\n    btn.style.cursor = 'default';\n    form.classList.add('submitted');\n  });\n\n  // Smooth scroll for anchor links\n  document.querySelectorAll('a[href^=\"#\"]').forEach(a => {\n    a.addEventListener('click', (e) => {\n      const id = a.getAttribute('href');\n      if (id.length > 1) {\n        const target = document.querySelector(id);\n        if (target) {\n          e.preventDefault();\n          const top = target.getBoundingClientRect().top + window.scrollY - 60;\n          window.scrollTo({ top, behavior: 'smooth' });\n        }\n      }\n    });\n  });\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
